<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F3EFE7">
<title>The DOZI Design — Studio</title>
<meta name="description" content="Choose a base, then a fit, colour, collar, sleeve, attachments and finish. Watch it become yours.">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/dozi.css">
</head>
<body data-page="design">

<main class="studio" data-studio>

  <aside class="studio__steps">
    <span class="caps muted">The DOZI Design</span>
    <p class="serif" style="font-size:30px;line-height:1.08;margin:14px 0 0">Choose a base.<br><em>Decide how it becomes yours.</em></p>
    <ol data-steps></ol>
    <p class="caps-sm muted" style="margin-top:auto;padding-top:28px">Touch any part of the garment to change it.</p>
  </aside>

  <section class="studio__stage" data-stage aria-label="Your garment">
    <div class="meta caps-sm"><span data-design-title>The Set</span><span>Made for you</span></div>
    <div class="look stage-look" data-look role="img"></div>
    <span class="change-tag" aria-hidden="true">Change this</span>
    <div class="tray" role="dialog" aria-label="Components"></div>
    <span class="hint caps-sm">Detach · Attach · Swap · Adapt · Express</span>
  </section>

  <aside class="studio__panel" data-panel aria-label="Options"></aside>

</main>

<section class="wrap section">
  <div class="section-head"><span class="caps">The parts, up close</span><span class="caps muted">Every part is real, every join is engineered</span></div>
  <div class="parts-grid">
    <figure><div class="frame"><img loading="lazy" src="assets/img/studio/parts/detail-sleeve-zip.jpg" alt="The DOZI zip pull at the sleeve join."></div><figcaption class="caps-sm">Sleeve zip</figcaption></figure>
    <figure><div class="frame"><img loading="lazy" src="assets/img/studio/parts/detail-snap.jpg" alt="Brass attachment snap stamped with the leaf."></div><figcaption class="caps-sm">Attachment snap</figcaption></figure>
    <figure><div class="frame"><img loading="lazy" src="assets/img/studio/parts/detail-side-zip.jpg" alt="The side zip channel that takes contrast panels."></div><figcaption class="caps-sm">Side zip channel</figcaption></figure>
    <figure><div class="frame"><img loading="lazy" src="assets/img/studio/parts/detail-charm-loop.jpg" alt="The hem loop with a brass D-ring."></div><figcaption class="caps-sm">Hem loop</figcaption></figure>
    <figure><div class="frame"><img loading="lazy" src="assets/img/studio/parts/detail-leaf-charm.jpg" alt="The brass DOZI leaf charm."></div><figcaption class="caps-sm">Leaf charm</figcaption></figure>
    <figure><div class="frame"><img loading="lazy" src="assets/img/studio/parts/detail-mark.jpg" alt="The tonal embroidered DOZI leaf."></div><figcaption class="caps-sm">Embroidered mark</figcaption></figure>
  </div>
</section>

<script src="assets/js/look.js"></script>
<script src="assets/js/site.js"></script>
<script src="assets/js/studio.js"></script>
</body>
</html>

<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:28px;box-sizing:border-box;background:var(--fabric-denim);color:var(--bone-100)}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px;align-items:center">
<div style="display:grid;gap:10px"><span style="height:1.5px;background:var(--stitch-h)"></span><span style="height:1.5px;background:var(--stitch-h)"></span><span style="font:var(--text-caption);color:var(--text-on-denim-muted);letter-spacing:.1em">DOUBLE TOPSTITCH · --stitch-h</span></div>
<div style="position:relative;height:120px;background:var(--fabric-bone);box-shadow:var(--shadow-patch)"><span style="position:absolute;inset:7px;border:1.5px dashed var(--thread)"></span></div>
<div style="position:relative;height:120px;background:var(--fabric-denim-washed);box-shadow:var(--shadow-patch)"><span style="position:absolute;inset:7px;border:1.5px dashed var(--thread)"></span><span style="position:absolute;inset:13px;border:1.5px dashed var(--thread)"></span></div></div></body></html>

<!-- @dsCard group="Colors" viewport="700x170" name="Hardware & semantic" subtitle="Brass for detail, oxide as the single UI accent" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:28px;box-sizing:border-box}</style></head><body><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px"><div><div style="height:78px;background:var(--brass);border:1px solid var(--line)"></div><div style="font:var(--text-label);letter-spacing:.06em;margin-top:8px">Brass</div><div style="font:var(--text-caption);color:var(--text-muted)">--brass</div></div><div><div style="height:78px;background:var(--brass-dark);border:1px solid var(--line)"></div><div style="font:var(--text-label);letter-spacing:.06em;margin-top:8px">Brass dark</div><div style="font:var(--text-caption);color:var(--text-muted)">--brass-dark</div></div><div><div style="height:78px;background:var(--accent);border:1px solid var(--line)"></div><div style="font:var(--text-label);letter-spacing:.06em;margin-top:8px">Accent</div><div style="font:var(--text-caption);color:var(--text-muted)">--accent</div></div><div><div style="height:78px;background:var(--success);border:1px solid var(--line)"></div><div style="font:var(--text-label);letter-spacing:.06em;margin-top:8px">Success</div><div style="font:var(--text-caption);color:var(--text-muted)">--success</div></div><div><div style="height:78px;background:var(--error);border:1px solid var(--line)"></div><div style="font:var(--text-label);letter-spacing:.06em;margin-top:8px">Error</div><div style="font:var(--text-caption);color:var(--text-muted)">--error</div></div><div><div style="height:78px;background:var(--line-strong);border:1px solid var(--line)"></div><div style="font:var(--text-label);letter-spacing:.06em;margin-top:8px">Line</div><div style="font:var(--text-caption);color:var(--text-muted)">--line-strong</div></div></div></body></html>

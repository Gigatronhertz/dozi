<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script></head><body style="background:var(--fabric-denim)"><div id="r"></div>

const { FashionIcon, FASHION_ICON_NAMES } = NS;
ReactDOM.createRoot(r).render(<div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:'22px 10px',padding:28,color:'var(--bone-100)'}}>
 {FASHION_ICON_NAMES.map(n=><div key={n} style={{display:'grid',justifyItems:'center',gap:8}}><FashionIcon name={n} size={30} animate="always" color={n==='stitch'?'var(--thread)':'var(--bone-100)'}/><span style={{font:'var(--text-caption)',letterSpacing:'.14em',textTransform:'uppercase',color:'var(--text-on-denim-muted)'}}>{n}</span></div>)}
</div>);
</script></body></html>

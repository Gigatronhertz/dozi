<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F3EFE7">
<title>DOZI</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/dozi.css">
</head>
<body data-page="shop">

<main>
  <div class="pdp">
    <div class="pdp__media" data-media></div>
    <div class="pdp__info" data-info></div>
  </div>

  <section class="wrap section">
    <div class="section-head"><span class="caps">How it changes</span><span class="caps muted">Base → Add → Transform</span></div>
    <div class="changes" data-changes></div>
  </section>

  <section class="wrap" style="padding-bottom:clamp(72px,10vw,160px)">
    <div class="section-head"><span class="caps">Wear it with</span><a class="link-arrow" href="shop.html">Shop all <span aria-hidden="true">→</span></a></div>
    <div class="chapters" data-related></div>
  </section>
</main>

<script src="assets/js/garment.js"></script>
<script src="assets/js/site.js"></script>
<script>
(function () {
  var G = DOZI.garment, L = DOZI.LABELS, P = DOZI.DESIGN_PRICES;
  var id = new URLSearchParams(location.search).get("id") || "the-polo";
  var p = DOZI.product(id) || DOZI.product("the-polo");
  document.title = p.name + " — DOZI";

  var media = document.querySelector("[data-media]"), info = document.querySelector("[data-info]"), changes = document.querySelector("[data-changes]");
  media.innerHTML = '<img class="' + (p.flat ? "flat" : "") + '" src="' + DOZI.IMG + p.image + '" alt="' + DOZI.esc(p.name + ", " + p.material) + '">';

  function row(label, inner) { return "<tr><th>" + label + "</th><td>" + inner + "</td></tr>"; }
  function opt(key, val, label, pressed) { return '<button class="opt" data-k="' + key + '" data-v="' + val + '" aria-pressed="' + pressed + '">' + label + "</button>"; }
  function accordion() {
    return '<div class="accordion">' +
      "<details><summary>How the parts attach</summary><p>Every DOZI part fixes with one of three systems: the modular snap, the DOZI zip channel or the strap rail. Parts from one piece fit every other piece that shares the system.</p></details>" +
      "<details><summary>Fabric &amp; care</summary><p>Cold wash with all parts removed. Hang to dry. Leather and hardware are wiped clean, never washed.</p></details>" +
      "<details><summary>Made to order</summary><p>Your design is cut and assembled in Lagos and ships in 10–14 days. Parts can be added to your piece later.</p></details></div>";
  }

  /* ---------- Designable pieces: The Polo / The Set ---------- */
  if (p.design) {
    var state = Object.assign({}, G.DEFAULT_STATE, { base: id === "the-set" ? "set" : "polo", attachments: [] }, p.preset || {});
    media.insertAdjacentHTML("beforeend", '<div class="live" aria-live="polite"><div data-live></div><span class="caps-sm">Your design</span></div>');

    var renderInfo = function () {
      var attach = ["strap", "pocket", "panel"].map(function (a) { return opt("attach", a, L.attachments[a], state.attachments.indexOf(a) > -1); }).join("");
      info.innerHTML =
        '<span class="caps muted">' + (id === "the-set" ? "Chapter 02 — Oxide" : "Chapter 01 — Navy") + "</span>" +
        '<h1 class="pdp__title" style="margin-top:26px">' + DOZI.esc(p.name) + "</h1>" +
        '<p class="pdp__price">' + DOZI.money(DOZI.designPrice(state)) + "</p>" +
        '<p class="caps-sm muted" style="margin:0">' + G.COLORS[state.color].name + " / Heavy Cotton</p>" +
        '<p class="pdp__note" style="margin-top:28px">' + DOZI.esc(p.blurb) + "</p>" +
        '<p class="caps" style="margin:40px 0 0">Design it</p>' +
        '<table class="spec-table">' +
          row("Base", '<div class="opts">' + opt("base", "polo", "Polo", state.base === "polo") + opt("base", "set", "Polo + Trouser", state.base === "set") + "</div>") +
          row("Colour", '<div class="swatches">' + Object.keys(G.COLORS).map(function (c) { return '<button class="sw" style="background:' + G.COLORS[c].hex + '" data-k="color" data-v="' + c + '" aria-pressed="' + (state.color === c) + '" title="' + G.COLORS[c].name + '" aria-label="' + G.COLORS[c].name + '"></button>'; }).join("") + "</div>") +
          row("Fit", '<div class="opts">' + ["regular", "oversized", "cropped"].map(function (f) { return opt("fit", f, L.fit[f], state.fit === f); }).join("") + "</div>") +
          row("Collar", '<div class="opts">' + ["round", "polo", "mock"].map(function (c) { return opt("collar", c, L.collar[c], state.collar === c); }).join("") + "</div>") +
          row("Sleeve", '<div class="opts">' + ["short", "long", "raglan"].map(function (c) { return opt("sleeve", c, L.sleeve[c], state.sleeve === c); }).join("") + "</div>") +
          row("Attachment", '<div class="opts">' + opt("attach", "none", "None", !state.attachments.filter(function (a) { return a !== "charm"; }).length) + attach + "</div>") +
          row("Charm", '<div class="opts">' + opt("charm", "none", "None", state.attachments.indexOf("charm") < 0) + opt("charm", "dozi", "DOZI", state.attachments.indexOf("charm") > -1) + "</div>") +
        "</table>" +
        '<button class="btn btn--block" data-add>Add to bag — ' + DOZI.money(DOZI.designPrice(state)) + "</button>" +
        '<a class="link-arrow" style="margin-top:22px" data-studio href="design.html#' + encodeURIComponent(JSON.stringify(state)) + '">Open in the full studio <span aria-hidden="true">→</span></a>' +
        accordion();
      document.querySelector("[data-live]").innerHTML = G.render(state);
      var base = Object.assign({}, state, { attachments: [], collar: "round", sleeve: "short", base: "polo", sleeveColor: "match" });
      var add = Object.assign({}, state, { base: "polo" });
      if (!add.attachments.length) add.attachments = ["strap", "pocket"];
      if (add.collar === "round") add.collar = "polo";
      changes.innerHTML = [[base, "Base"], [add, "Add"], [Object.assign({}, add, { base: "set", attachments: add.attachments.concat(add.attachments.indexOf("charm") < 0 ? ["charm"] : []) }), "Transform"]].map(function (s, i) {
        return (i ? '<span class="arrow" aria-hidden="true">→</span>' : "") + '<figure><div class="frame" style="background:#EFEAE1">' + G.render(s[0], { viewBox: "40 24 520 900" }) + '</div><figcaption class="caps">0' + (i + 1) + " " + s[1] + "</figcaption></figure>";
      }).join("");
    };

    info.addEventListener("click", function (e) {
      var b = e.target.closest("[data-k]");
      if (b) {
        var k = b.getAttribute("data-k"), v = b.getAttribute("data-v");
        if (k === "attach") {
          var keep = state.attachments.filter(function (a) { return a === "charm"; });
          if (v !== "none") { var has = state.attachments.indexOf(v) > -1; keep = state.attachments.filter(function (a) { return a !== v; }); if (!has) keep.push(v); }
          state.attachments = keep;
        } else if (k === "charm") {
          state.attachments = state.attachments.filter(function (a) { return a !== "charm"; }).concat(v === "dozi" ? ["charm"] : []);
        } else {
          if (k === "color") state.bottomColor = v;
          state[k] = v;
        }
        renderInfo();
        DOZI.toast("Your design has changed.");
        return;
      }
      if (e.target.closest("[data-add]")) DOZI.addToBag({ name: L.base[state.base] + " — Your Design", price: DOZI.designPrice(state), design: JSON.parse(JSON.stringify(state)), spec: DOZI.designSummary(state) });
    });
    renderInfo();

  /* ---------- Every other piece ---------- */
  } else {
    var picks = {};
    (p.options || []).forEach(function (o) { picks[o[0]] = o[1][0]; });
    var renderOther = function () {
      info.innerHTML =
        '<span class="caps muted">' + DOZI.esc((DOZI.COLLECTIONS.filter(function (c) { return c.id === p.collection; })[0] || {}).name || "") + "</span>" +
        '<h1 class="pdp__title" style="margin-top:26px">' + DOZI.esc(p.name) + "</h1>" +
        '<p class="pdp__price">' + DOZI.money(p.price) + "</p>" +
        '<p class="caps-sm muted" style="margin:0">' + DOZI.esc(p.material) + "</p>" +
        '<p class="pdp__note" style="margin-top:28px">' + DOZI.esc(p.blurb) + "</p>" +
        '<p class="caps" style="margin:40px 0 0">Design it</p><table class="spec-table">' +
        (p.options || []).map(function (o) { return row(o[0], '<div class="opts">' + o[1].map(function (v) { return opt(o[0], v, v, picks[o[0]] === v); }).join("") + "</div>"); }).join("") +
        row("Size", '<div class="opts">' + ["XS", "S", "M", "L", "XL"].map(function (s) { return opt("Size", s, s, picks.Size === s); }).join("") + "</div>") +
        '</table><button class="btn btn--block" data-add>Add to bag</button>' + accordion();
    };
    info.addEventListener("click", function (e) {
      var b = e.target.closest("[data-k]");
      if (b) { picks[b.getAttribute("data-k")] = b.getAttribute("data-v"); renderOther(); return; }
      if (e.target.closest("[data-add]")) {
        if (!picks.Size) { DOZI.toast("Choose a size"); return; }
        DOZI.addToBag({ name: p.name, price: p.price, image: p.image, flat: p.flat, spec: Object.keys(picks).map(function (k) { return [k, picks[k]]; }) });
      }
    });
    renderOther();
    changes.innerHTML = (p.changes || []).map(function (c, i) {
      var flat = /^p-/.test(c[0]);
      return (i ? '<span class="arrow" aria-hidden="true">→</span>' : "") + '<figure><div class="frame' + (flat ? " frame--flat" : "") + '"><img loading="lazy" src="' + DOZI.IMG + c[0] + '" alt=""></div><figcaption class="caps">0' + (i + 1) + " " + c[1] + "</figcaption></figure>";
    }).join("");
  }

  /* ---------- Related ---------- */
  var rel = DOZI.PRODUCTS.filter(function (x) { return x.id !== p.id && (x.collection === p.collection || x.cat !== p.cat); }).slice(0, 4);
  document.querySelector("[data-related]").innerHTML = rel.map(function (x) {
    return '<a class="chapter" href="product.html?id=' + x.id + '"><div class="frame' + (x.flat ? " frame--flat" : "") + '"><img loading="lazy" src="' + DOZI.IMG + x.image + '" alt="' + DOZI.esc(x.name) + '"></div>' +
      '<div class="caption"><span class="name">' + DOZI.esc(x.name) + '</span><span class="price">' + DOZI.money(x.price) + "</span></div></a>";
  }).join("");
})();
</script>
</body>
</html>

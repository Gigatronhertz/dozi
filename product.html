<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F3EFE7">
<title>DOZI</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/dozi.css">
</head>
<body data-page="shop">

<main>
  <div class="pdp">
    <div class="pdp__media" data-media></div>
    <div class="pdp__info" data-info></div>
  </div>

  <section class="wrap section">
    <div class="section-head"><span class="caps">How it changes</span><span class="caps muted">Base → Add → Transform</span></div>
    <div class="changes" data-changes></div>
  </section>

  <section class="wrap" style="padding-bottom:clamp(72px,10vw,160px)">
    <div class="section-head"><span class="caps">Wear it with</span><a class="link-arrow" href="shop.html">Shop all <span aria-hidden="true">→</span></a></div>
    <div class="chapters" data-related></div>
  </section>
</main>

<script src="assets/js/look.js"></script>
<script src="assets/js/systems.js"></script>
<script src="assets/js/site.js"></script>
<script>
(function () {
  var id = new URLSearchParams(location.search).get("id") || "the-polo";
  var p = DOZI.product(id) || DOZI.product("the-polo");
  document.title = p.name + " — DOZI";

  var media = document.querySelector("[data-media]"), info = document.querySelector("[data-info]"), changes = document.querySelector("[data-changes]");
  media.innerHTML = '<img class="' + (p.flat ? "flat" : "") + '" src="' + DOZI.IMG + p.image + '" alt="' + DOZI.esc(p.name + ", " + p.material) + '">';

  function row(label, inner) { return "<tr><th>" + label + "</th><td>" + inner + "</td></tr>"; }
  function opt(key, val, label, pressed) { return '<button class="opt" data-k="' + key + '" data-v="' + val + '" aria-pressed="' + pressed + '">' + label + "</button>"; }
  function accordion() {
    return '<div class="accordion">' +
      "<details><summary>How the parts attach</summary><p>Every DOZI part fixes with one of three systems: the modular snap, the DOZI zip channel or the strap rail. Parts from one piece fit every other piece that shares the system.</p></details>" +
      "<details><summary>Fabric &amp; care</summary><p>Cold wash with all parts removed. Hang to dry. Leather and hardware are wiped clean, never washed.</p></details>" +
      "<details><summary>Made to order</summary><p>Your design is cut and assembled in Lagos and ships in 10–14 days. Parts can be added to your piece later.</p></details></div>";
  }

  /* ---------- The Polo, designed part by part ---------- */
  if (p.design) {
    var LK = DOZI.look, state = LK.normalize(p.preset || {});
    media.insertAdjacentHTML("beforeend", '<div class="live" aria-live="polite"><div data-live></div><span class="caps-sm">Your design</span></div>');

    var renderInfo = function () {
      var thumb = function (k, v, label, img, pressed) {
        return '<button class="opt opt--img" data-k="' + k + '" data-v="' + v + '" aria-pressed="' + pressed + '">' + (img ? '<img src="' + img + '" alt="">' : "") + "<span>" + label + "</span></button>";
      };
      var parts = LK.ROOT + "parts/";
      info.innerHTML =
        '<span class="caps muted">Chapter 01 — Navy</span>' +
        '<h1 class="pdp__title" style="margin-top:26px">' + DOZI.esc(p.name) + "</h1>" +
        '<p class="pdp__price">' + DOZI.money(DOZI.designPrice(state)) + "</p>" +
        '<p class="caps-sm muted" style="margin:0">' + LK.COLORS[state.color].name + " / Heavy Cotton Piqué</p>" +
        '<p class="pdp__note" style="margin-top:28px">' + DOZI.esc(p.blurb) + "</p>" +
        '<p class="caps" style="margin:40px 0 0">Design it</p>' +
        '<table class="spec-table">' +
          row("Colour", '<div class="swatches">' + Object.keys(LK.COLORS).map(function (c) { return '<button class="sw sw--photo" style="background-image:url(' + LK.ROOT + "swatch/" + c + '.jpg)" data-k="color" data-v="' + c + '" aria-pressed="' + (state.color === c) + '" title="' + LK.COLORS[c].name + '" aria-label="' + LK.COLORS[c].name + '"></button>'; }).join("") + "</div>") +
          row("Collar", '<div class="opts">' + thumb("collar", "polo", "Polo", parts + "collar-polo.jpg", state.collar === "polo") + thumb("collar", "crew", "Crew", parts + "collar-crew.jpg", state.collar === "crew") + "</div>") +
          row("Sleeve", '<div class="opts">' + thumb("sleeve", "short", "Short", parts + "sleeve-short.jpg", state.sleeve === "short") + thumb("sleeve", "long", "Long", parts + "sleeve-long.jpg", state.sleeve === "long") + "</div>") +
          row("Attachment", '<div class="opts">' + thumb("pocket", !state.pocket, "Pocket", parts + "att-pocket.jpg", state.pocket) + thumb("panels", !state.panels, "Side panels", parts + "att-panel.jpg", state.panels) + "</div>") +
          row("Hem", '<div class="opts">' + opt("hem", "none", "None", state.hem === "none") + thumb("hem", "charm", "Charm", parts + "att-charm.jpg", state.hem === "charm") + thumb("hem", "strap", "Strap", parts + "att-strap.jpg", state.hem === "strap") + "</div>") +
          row("Hardware", '<div class="opts">' + Object.keys(LK.HARDWARE).map(function (k) { return thumb("hardware", k, LK.HARDWARE[k].name, parts + "hw-" + k + ".jpg", state.hardware === k); }).join("") + "</div>") +
        "</table>" +
        '<button class="btn btn--block" data-add>Add to bag — ' + DOZI.money(DOZI.designPrice(state)) + "</button>" +
        '<a class="link-arrow" style="margin-top:22px" href="design.html#' + encodeURIComponent(JSON.stringify(state)) + '">Open in the full studio <span aria-hidden="true">→</span></a>' +
        accordion();
      document.querySelector("[data-live]").innerHTML = LK.html(state, { eager: true });
      var base = LK.normalize({ color: state.color, hardware: state.hardware, collar: "crew" });
      var add = Object.assign({}, base, { collar: "polo", pocket: true, hem: "charm" });
      var transform = Object.assign({}, state, { pocket: true, panels: true, hem: state.hem === "none" ? "strap" : state.hem, sleeve: state.sleeve === "short" ? "long" : state.sleeve });
      changes.innerHTML = [[base, "Base"], [add, "Add"], [transform, "Transform"]].map(function (s, i) {
        return (i ? '<span class="arrow" aria-hidden="true">→</span>' : "") + '<figure><div class="frame frame--look">' + LK.html(s[0]) + '</div><figcaption class="caps">0' + (i + 1) + " " + s[1] + "</figcaption></figure>";
      }).join("");
    };

    info.addEventListener("click", function (e) {
      var b = e.target.closest("[data-k]");
      if (b) {
        var k = b.getAttribute("data-k"), v = b.getAttribute("data-v");
        state[k] = (k === "pocket" || k === "panels") ? v === "true" : v;
        state = LK.normalize(state);
        renderInfo();
        DOZI.toast("Your design has changed.");
        return;
      }
      if (e.target.closest("[data-add]")) DOZI.addToBag({ name: "The Polo — Your Design", price: DOZI.designPrice(state), design: JSON.parse(JSON.stringify(state)), spec: DOZI.designSummary(state) });
    });
    renderInfo();

  /* ---------- Photographed systems: every other piece ---------- */
  } else {
    var SY = DOZI.systems, x = SY.get(p.id), st = SY.normalize({ base: p.id }), size = null;
    var mediaImg = media.querySelector("img");
    var renderSys = function () {
      var src = SY.img(x, st.color, st.v);
      if (mediaImg.getAttribute("src") !== src) { mediaImg.style.opacity = 0; LK2(src).then(function () { mediaImg.src = src; mediaImg.style.opacity = 1; }); }
      var vtile = function (i) {
        return '<button class="opt opt--img" data-k="v" data-v="' + i + '" aria-pressed="' + (st.v === i) + '"><img src="' + SY.img(x, st.color, i) + '" alt=""><span>' + x.versions[i][0] + "</span></button>";
      };
      info.innerHTML =
        '<span class="caps muted">' + DOZI.esc((DOZI.COLLECTIONS.filter(function (c) { return c.id === p.collection; })[0] || {}).name || "") + "</span>" +
        '<h1 class="pdp__title" style="margin-top:26px">' + DOZI.esc(p.name) + "</h1>" +
        '<p class="pdp__price">' + DOZI.money(SY.price(st)) + "</p>" +
        '<p class="caps-sm muted" style="margin:0">' + SY.COLOURS[st.color].name + " / " + DOZI.esc(p.material) + "</p>" +
        '<p class="pdp__note" style="margin-top:28px">' + DOZI.esc(p.blurb) + "</p>" +
        '<p class="caps" style="margin:40px 0 0">Design it</p><table class="spec-table">' +
        (x.colours.length > 1 ? row("Colour", '<div class="opts">' + x.colours.map(function (c) { return '<button class="opt opt--img" data-k="color" data-v="' + c + '" aria-pressed="' + (st.color === c) + '"><img src="' + SY.img(x, c, st.v) + '" alt=""><span>' + SY.COLOURS[c].name + "</span></button>"; }).join("") + "</div>") : "") +
        row("Version", '<div class="opts">' + x.versions.map(function (v, i) { return vtile(i); }).join("") + '</div><p class="caps-sm muted" style="margin:10px 0 0">' + DOZI.esc(x.versions[st.v][1]) + "</p>") +
        row("Size", '<div class="opts">' + ["XS", "S", "M", "L", "XL"].map(function (z) { return opt("size", z, z, size === z); }).join("") + "</div>") +
        '</table><button class="btn btn--block" data-add>Add to bag — ' + DOZI.money(SY.price(st)) + "</button>" +
        '<a class="link-arrow" style="margin-top:22px" href="design.html#' + encodeURIComponent(JSON.stringify(st)) + '">Open in the studio <span aria-hidden="true">→</span></a>' + accordion();
    };
    var LK2 = function (src) { return new Promise(function (r) { var im = new Image(); im.onload = im.onerror = r; im.src = src; }); };
    mediaImg.style.transition = "opacity .35s";
    info.addEventListener("click", function (e) {
      var b = e.target.closest("[data-k]");
      if (b) {
        var k = b.getAttribute("data-k"), v = b.getAttribute("data-v");
        if (k === "size") size = v; else { st[k] = k === "v" ? +v : v; st = SY.normalize(st); DOZI.toast("Your design has changed."); }
        renderSys(); return;
      }
      if (e.target.closest("[data-add]")) {
        if (!size) { DOZI.toast("Choose a size"); return; }
        DOZI.addToBag({ name: x.name + " — " + x.versions[st.v][0], price: SY.price(st), design: Object.assign({}, st), spec: SY.summary(st).concat([["Size", size]]) });
      }
    });
    renderSys();
    var n = x.versions.length, picks = [0, Math.floor((n - 1) / 2), n - 1];
    changes.innerHTML = picks.map(function (v, i) {
      return (i ? '<span class="arrow" aria-hidden="true">→</span>' : "") + '<figure><div class="frame frame--flat"><img loading="lazy" src="' + SY.img(x, st.color, v) + '" alt="' + DOZI.esc(x.versions[v][0]) + '"></div><figcaption class="caps">0' + (i + 1) + " " + ["Base", "Add", "Transform"][i] + " · " + x.versions[v][0] + "</figcaption></figure>";
    }).join("");
  }

  /* ---------- Related ---------- */
  var rel = DOZI.PRODUCTS.filter(function (x) { return x.id !== p.id && (x.collection === p.collection || x.cat !== p.cat); }).slice(0, 4);
  document.querySelector("[data-related]").innerHTML = rel.map(function (x) {
    return '<a class="chapter" href="product.html?id=' + x.id + '"><div class="frame' + (x.flat ? " frame--flat" : "") + '"><img loading="lazy" src="' + DOZI.IMG + x.image + '" alt="' + DOZI.esc(x.name) + '"></div>' +
      '<div class="caption"><span class="name">' + DOZI.esc(x.name) + '</span><span class="price">' + DOZI.money(x.price) + "</span></div></a>";
  }).join("");
})();
</script>
</body>
</html>
